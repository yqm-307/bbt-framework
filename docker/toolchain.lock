# bbt-framework CI 工具链固定输入（Issue #37 / plan framework-p0-a-toolchain-image）
#
# 每行 key=value；docker/build_toolchain.sh、scripts/verify_toolchain.sh 与
# docker/*/Dockerfile 只认本文件。基础镜像 digest 由只读 registry 解析得到
# （多架构 index digest），禁止浮动 latest/tag。
#
# 说明：这是本机候选 / 待部署输入。当前远端 arc-s4 runner 是否已切到本配方
# 不由本文件证明，见 docker/README.md 的"本机候选 vs 远端待部署"。

