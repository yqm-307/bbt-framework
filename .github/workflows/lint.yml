name: lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpp_lint:
    name: "C++ lint report"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: "拉取代码库与固定版 pub"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: true
          persist-credentials: false

      - name: "验证 lint 入口契约"
        run: python3 -B -m unittest scripts/ci/test_check_lint.py

      - name: "扫描 C++ 候选并报告覆盖"
        run: python3 -I scripts/ci/check_lint.py --root .
