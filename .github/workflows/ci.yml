# bbt-framework 正式普通 CI（唯一权威普通入口）。
#
# 来源与边界：本文件由已独立审查并在线验收的 hosted 影子候选升级而来（Issue #50/#53；
# 在线 run 37894777696 / 37894762797 / 37896340110，CTest 19/19、0 失败 0 skip）。升级
# 内容：把普通 build→test 判据迁到 hosted `ubuntu-24.04`，并复用已发布 fixed-SHA 的
# framework 分类/结果 reusable callee（`bbtools-classify-v1.yml@1c0b0fb0…`）；影子入口
# `.github/workflows/ci-shadow-v1.yml` 已删除，普通 check 只有本文件一个 producer（非双跑）。
#
# 保留（不迁 runner/镜像/资源边界）：`workflow_dispatch` 手动工具链身份验收
# `toolchain-verify` 与双服务资源验收 `resource-acceptance`（固定资源 recipe SHA、
# Redis/Mongo 镜像 digest、专用前缀与清理）原样保留，仅在手动触发时运行。
#
# 判据等价：`scripts/fetch_deps.sh`（`deps.lock` 固定 SHA）→ `scripts/prepare_protobuf.sh`
# （锁定 3.21.12 私有前缀）→ `scripts/local_build.sh` → `scripts/build_stack.sh`；
# dual-service 负向门禁、链接来源证据、`ctest -j1 --timeout 300 --output-on-failure
# --no-tests=error` 与 SKIP/Not Run 门禁全部保留。hosted 无 `/opt/boost`，按
# `docker/toolchain.lock` 的版本/sha256 源码复现 Boost 1.90 `context` 到工作区私有前缀
# （不改镜像、不装系统包、不写 /usr/local），锁定 runtime 随归档传到独立 test runner。
#
# 权威身份：workflow 名保持 `ci`，job 名保持现役 required check 名（`变更类型检测` /
# `Build (pinned deps)` / `Test (ctest -j1)`），避免 required context 悬空；`plan`/`result`
# 复用已发布 callee 的 caller/callee 身份分离，`result` 恒 `always()` 汇聚、fail-closed。
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # 手动入口：工具链身份验收 + 双服务资源验收（非 required），并可手动跑普通 build→test。
  workflow_dispatch:
    inputs:
      resource_acceptance:
        description: "运行固定资源 recipe + Redis/Mongo 双服务真实验收（非 required）"
        type: boolean
        default: false

permissions: {}

concurrency:
  # main/手动：group 含 run_id → 逐提交独立、互不取消（保逐提交结果）；
  # PR：group 用 github.ref（refs/pull/<N>/merge）→ 只取消同一 PR 的旧 run。
  group: ci-${{ github.event_name == 'pull_request' && github.ref || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # build 与 test 使用同一 workspace 绝对路径，保证构建树 RUNPATH（指向 $BBT_BUILD_DIR）
  # 与 Boost/源码绝对路径在 artifact 传递到另一 runner 后仍有效。
  BBT_WORK_DIR: ${{ github.workspace }}/.ci-work
  BBT_BUILD_DIR: ${{ github.workspace }}/.ci-work/project-build
  BBT_DEPS_DIR: ${{ github.workspace }}/.deps
  BBT_PROTOBUF_PREFIX: ${{ github.workspace }}/.deps/protobuf-3.21.12
  BOOST_PREFIX: ${{ github.workspace }}/boost-prefix
  BBT_BUILD_ARCHIVE: ${{ github.workspace }}/build-tree.tar.gz
  # hosted 4 vCPU：固定 3，与三仓统一并发口径一致，不按 nproc 抢占。
  BBT_JOBS: "3"

jobs:
  # 变更集：从真实 diff 归一为受限路径列表，交给 framework classify callee 分类。
  # 任何无法确定的情形保守回退为 unknown（callee 判定执行全部），绝不擅自判绿。
  # job 名保持现役 required check 名「变更类型检测」，required context 不悬空。
  changes:
    name: "变更类型检测"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changed_files_json: ${{ steps.diff.outputs.changed_files_json }}
      classifier_status: ${{ steps.diff.outputs.classifier_status }}
      event_json: ${{ steps.diff.outputs.event_json }}
    steps:
      - name: "拉取代码库（含历史，供三点 diff）"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "从真实 diff 计算受限变更集（未知保守全部）"
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/ci/changed_files.py

  # 分类/计划（classification-only）：只调用已发布 callee，不传 results。
  plan:
    name: "分类/计划（framework classify callee）"
    needs: [changes]
    uses: yqm-307/bbt-framework/.github/workflows/bbtools-classify-v1.yml@1c0b0fb0ebc8e7ca3888aa4f6a74d1baecf08cc7
    permissions:
      contents: read
    with:
      repo: ${{ github.repository }}
      source_sha: ${{ github.sha }}
      profile: hosted
      concurrency: "2"
      timeout_minutes: "60"
      event_json: ${{ needs.changes.outputs.event_json }}
      changed_files_json: ${{ needs.changes.outputs.changed_files_json }}
      # required = 恒跑且决定「不得全跳过变绿」的轻量 job；optional = 重型构建/测试 job
      # （仅 docs-only 允许显式跳过）。集合互斥、非空，由 callee 校验。
      required_checks_json: '["changes","plan"]'
      optional_checks_json: '["build","test"]'
      classifier_status: ${{ needs.changes.outputs.classifier_status }}

  # 重型构建（build→test 两独立 hosted runner）：仅当分类为 code/unknown 时运行；docs-only
  # 显式跳过。判据与现役等价（固定依赖/锁定 protobuf/Boost 前缀/dual-service 负向门禁/
  # 链接来源证据），并把构建树 + 锁定 Boost runtime 打成单一 tar 归档。job 名保持现役
  # required check 名「Build (pinned deps)」。
  build:
    name: "Build (pinned deps)"
    needs: [changes, plan]
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.classification != 'docs-only' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    outputs:
      archive_sha256: ${{ steps.pack.outputs.build_archive_sha256 }}
      provenance_digest: ${{ steps.pack.outputs.provenance_digest }}
      producer_run_attempt: ${{ steps.pack.outputs.producer_run_attempt }}
    steps:
      - name: "拉取代码库"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: "拉取 deps.lock 固定依赖（coroutine/infra 源码树）"
        run: bash scripts/fetch_deps.sh

      - name: "准备锁定 protobuf 前缀（build 侧，私有前缀）"
        run: bash scripts/prepare_protobuf.sh "$BBT_PROTOBUF_PREFIX"

      - name: "复现锁定 Boost 1.90 context（工作区私有前缀，hosted 无 /opt/boost）"
        run: bash scripts/ci/prepare_boost.sh "$BOOST_PREFIX" --jobs "$BBT_JOBS"

      - name: "构建 + 门禁 + 封包（等价现役 build 判据，含 provenance 与真实归档 sha256）"
        id: pack
        run: |
          set -euo pipefail
          out="$(bash scripts/ci/run_framework_gate.sh build \
            --repo-dir "$GITHUB_WORKSPACE" \
            --work-dir "$BBT_WORK_DIR" \
            --deps-dir "$BBT_DEPS_DIR" \
            --protobuf-prefix "$BBT_PROTOBUF_PREFIX" \
            --boost-prefix "$BOOST_PREFIX" \
            --archive "$BBT_BUILD_ARCHIVE" \
            --pack-root "$GITHUB_WORKSPACE" \
            --jobs "$BBT_JOBS" \
            --job-id build \
            --source-repo "$GITHUB_REPOSITORY" \
            --source-sha "$GITHUB_SHA" \
            --automation-repo "$GITHUB_REPOSITORY" \
            --automation-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT")"
          printf '%s\n' "$out"
          # 只把真实 key=value 行写入 GITHUB_OUTPUT；诊断（含 cat 的证据）已走 stderr。
          printf '%s\n' "$out" | grep -E '^(build_archive_sha256|provenance_digest|archive_bytes|producer_run_attempt)=' >> "$GITHUB_OUTPUT"

      - name: "Upload build tree（same-run only；名称含 run_id，权威 artifact 名 bbt-build）"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bbt-build-${{ github.run_id }}
          path: ${{ env.BBT_BUILD_ARCHIVE }}
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: "Cleanup build workspace（build 侧；test 跑在另一 runner，清不到这里）"
        if: always()
        run: rm -rf "$BBT_WORK_DIR" "$BOOST_PREFIX" "$BBT_DEPS_DIR"

  # 独立 runner 上的 ctest：下载 build 归档 → 校验 sha256 → 闭集成员/穿越/symlink 门禁后
  # 安全解包 → provenance 复核 → 恢复执行位/ldd 来源核查 → ctest -j1 --timeout 300 + SKIP 门禁。
  # job 名保持现役 required check 名「Test (ctest -j1)」。
  test:
    name: "Test (ctest -j1)"
    needs: [changes, plan, build]
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.classification != 'docs-only' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: "拉取测试源码（ctest 用例引用的绝对路径源文件）"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: "准备锁定 protobuf 前缀（test 侧同绝对路径，供 protoc 绝对路径用例）"
        # 构建树的 CTest 配置把 examples.getvalue.xlang 的 --protoc/--protoc-libdir 与
        # framework.rpc_xlang 的 protoc 用法固化为绝对路径；test 是新 runner 新 checkout，
        # checkout 已清掉未跟踪的 .deps。这里复用 build 侧同一 prepare_protobuf.sh 在相同
        # 绝对路径重建锁定前缀（只解包 debs 进私有前缀，不装系统包、不碰系统 protoc）。
        run: bash scripts/prepare_protobuf.sh "$BBT_PROTOBUF_PREFIX"

      - name: "Download build archive（same-run only：仅本 run 的 artifact）"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bbt-build-${{ github.run_id }}
          path: ${{ github.workspace }}

      - name: "校验并安全解包 build 归档（先校验 sha256，再闭集/穿越/symlink gate）"
        env:
          EXPECTED_ARCHIVE_SHA256: ${{ needs.build.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          bash scripts/ci/run_framework_gate.sh verify-archive \
            --archive "$BBT_BUILD_ARCHIVE" \
            --expected-sha256 "$EXPECTED_ARCHIVE_SHA256" \
            --dest "$GITHUB_WORKSPACE" \
            --allow-prefix ".ci-work" \
            --allow-prefix "boost-prefix/lib"

      - name: "校验 provenance（复用 shared artifact 契约：source/run/attempt/job）"
        env:
          EXPECTED_PROVENANCE_DIGEST: ${{ needs.build.outputs.provenance_digest }}
          EXPECTED_PRODUCER_RUN_ATTEMPT: ${{ needs.build.outputs.producer_run_attempt }}
        run: |
          set -euo pipefail
          meta="$BBT_WORK_DIR/artifact-meta"
          test -f "$meta/manifest.json"
          test -f "$meta/envelope.json"
          receipt="$RUNNER_TEMP/provenance-receipt.json"
          python3 - "$receipt" <<'PY'
          import json
          import os
          import sys

          meta = os.path.join(os.environ["BBT_WORK_DIR"], "artifact-meta")
          with open(os.path.join(meta, "envelope.json"), encoding="utf-8") as handle:
              envelope = json.load(handle)["envelope"]
          expected = {
              "repo": os.environ["GITHUB_REPOSITORY"],
              "source_sha": os.environ["GITHUB_SHA"],
              "workflow_sha": os.environ["GITHUB_SHA"],
              "job": "build",
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              # 下游重跑复用成功 build 的身份，不改绑消费者 attempt。
              "run_attempt": int(os.environ["EXPECTED_PRODUCER_RUN_ATTEMPT"]),
              "payload_digest": os.environ["EXPECTED_PROVENANCE_DIGEST"],
          }
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump({"root": meta, "path": "manifest.json",
                         "envelope": envelope, "expected": expected}, handle)
          PY
          python3 scripts/ci/shared/cli.py verify-receipt --file "$receipt"

      - name: "恢复执行位 + RPC/examples 产物完整性（artifact 往返丢 +x）"
        run: |
          set -euo pipefail
          rpc_candidates=$(find "$BBT_WORK_DIR" -type f -name rpc_xlang_server -print)
          rpc_count=$(printf '%s\n' "$rpc_candidates" | sed '/^$/d' | wc -l)
          if [ "$rpc_count" -ne 1 ]; then
            echo "FATAL: artifact 中 rpc_xlang_server 候选数=$rpc_count" >&2
            find "$BBT_WORK_DIR" -maxdepth 6 -type f \( -name 'Test_framework_*' -o -name 'rpc_xlang_server' \) >&2 || true
            exit 1
          fi
          actual_build_dir="${rpc_candidates%/tests/rpc_xlang_server}"
          if [ ! -d "$actual_build_dir/tests" ]; then
            echo "FATAL: 无效 build root: $actual_build_dir" >&2
            exit 1
          fi
          echo "BBT_BUILD_DIR=$actual_build_dir" >> "$GITHUB_ENV"
          export BBT_BUILD_DIR="$actual_build_dir"
          chmod +x "$BBT_BUILD_DIR"/tests/Test_framework_* 2>/dev/null || true
          test -f "$BBT_BUILD_DIR/tests/rpc_xlang_server"
          chmod +x "$BBT_BUILD_DIR/tests/rpc_xlang_server"
          # examples 的 Python 驱动器会 spawn 下列产物；artifact 往返丢 +x 后必须与 tests/
          # 同口径恢复执行位，缺任一产物即失败，不静默跳过。
          for exe in getvalue/getvalue_server getvalue/getvalue_caller two_service/two_service lifecycle_matrix/lifecycle_fixture; do
            bin="$BBT_BUILD_DIR/examples/$exe"
            if [ ! -f "$bin" ]; then
              echo "FATAL: artifact 缺少 $bin" >&2
              exit 1
            fi
            chmod +x "$bin"
          done
          ls -la "$BBT_BUILD_DIR"/tests/ | head -n 20

      - name: "导出锁定 Boost runtime 前缀（hosted 无 /opt/boost，随归档同绝对前缀）"
        run: |
          test -e "$BOOST_PREFIX/lib/libboost_context.so"
          echo "BOOST_ROOT=$BOOST_PREFIX" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$BOOST_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: "Verify test binaries resolve libs (fail-fast)"
        run: |
          # test 跑在新 runner 上，build 期 local_build.sh 的 LD 清理带不过来：
          # 镜像 LD_LIBRARY_PATH=/opt/boost/lib:/usr/local/lib 优先于 RUNPATH，
          # 会把已指对 build 树的 NEEDED 抢绑到 /usr/local 旧产物。这里重做同款剔除。
          if [ -n "${LD_LIBRARY_PATH:-}" ]; then
            LD_LIBRARY_PATH="$(printf '%s' "$LD_LIBRARY_PATH" | tr ':' '\n' | grep -vE '^/usr/local(/|$)' | paste -sd: -)"
            export LD_LIBRARY_PATH
          fi
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-<empty>}"
          missing=0
          found=0
          for bin in "$BBT_BUILD_DIR"/tests/Test_framework_*; do
            [ -x "$bin" ] || continue
            found=$((found + 1))
            echo "--- $bin ---"
            ldd "$bin" 2>/dev/null | grep -E 'bbt|boost' || echo "(静态/无外部依赖)"
            if ldd "$bin" 2>/dev/null | grep -q 'not found'; then
              echo "FATAL: $bin 有未解析依赖" >&2
              missing=1
            fi
          done
          # 零命中必须明确失败：禁止 [ -x ] 全跳过后带着空证据混过去。
          if [ "$found" -eq 0 ]; then
            echo "FATAL: 未找到可执行测试二进制 ($BBT_BUILD_DIR/tests/Test_framework_*)" >&2
            ls -la "$BBT_BUILD_DIR"/tests/ >&2 || true
            exit 9
          fi
          if ldd "$BBT_BUILD_DIR/tests/rpc_xlang_server" | grep -q 'not found'; then
            echo "FATAL: rpc_xlang_server 有未解析依赖" >&2
            missing=1
          fi
          echo "verified binaries: $found"
          # hosted 工具链闭包附加断言（非现役判据）：检查 Boost context runtime 可解析
          # （不能只靠系统预装版本假替代，解析路径必须在归档内的私有前缀）。
          boost_links=$(ldd "$BBT_BUILD_DIR"/tests/Test_framework_* 2>/dev/null)
          if ! printf '%s\n' "$boost_links" | grep -E 'libboost_context[^ ]* => ' | grep -Fq "=> $BOOST_PREFIX/lib/"; then
            echo "FATAL: libboost_context 未解析到归档内的 Boost 前缀" >&2
            missing=1
          fi
          # bbt 必须解析到 build 树内（干净 runner 不许吃 /usr/local 旧产物）
          if ldd "$BBT_BUILD_DIR"/tests/Test_framework_* 2>/dev/null | grep -q '/usr/local/.*bbt'; then
            echo "FATAL: 链接到 /usr/local 下的 bbt 旧产物" >&2
            missing=1
          fi
          exit "$missing"

      - name: "CTest (镜像 scripts/run_ctest.sh 门禁 + --timeout 300)"
        run: |
          # 同 Verify：ctest 子进程继承本 step 环境，先剔除 /usr/local，
          # 否则用例运行时 NEEDED 被 LD 抢绑到旧产物（RUNPATH 救不回来）。
          if [ -n "${LD_LIBRARY_PATH:-}" ]; then
            LD_LIBRARY_PATH="$(printf '%s' "$LD_LIBRARY_PATH" | tr ':' '\n' | grep -vE '^/usr/local(/|$)' | paste -sd: -)"
            export LD_LIBRARY_PATH
          fi
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-<empty>}"
          set +e
          ctest --test-dir "$BBT_BUILD_DIR" -j1 --timeout 300 --output-on-failure --no-tests=error | tee "$BBT_BUILD_DIR/ctest.log"
          rc=${PIPESTATUS[0]}
          set -e
          # 只认 ctest 自身的结果行（"1/12 Test #1: ..."），不用例 stdout，
          # 避免用例打印 "Not Run" 文字造成误判；同时要求 100% 全绿。
          if grep -Eq '^[ ]*[0-9]+/[0-9]+ Test #[0-9]+:.*\*\*\*(Skipped|Not Run)' "$BBT_BUILD_DIR/ctest.log"; then
            echo "FATAL: 检测到 SKIP/Not Run，禁止报全绿" >&2
            exit 8
          fi
          if ! grep -Eq '100% tests passed, 0 tests failed' "$BBT_BUILD_DIR/ctest.log"; then
            echo "FATAL: 未达成 100% 全绿" >&2
            exit 8
          fi
          exit "$rc"

      - name: "Link-source evidence 复核"
        run: |
          test -f "$BBT_WORK_DIR/deps-manifest.txt"
          test -f "$BBT_WORK_DIR/link-sources.txt"
          cat "$BBT_WORK_DIR/deps-manifest.txt"
          cat "$BBT_WORK_DIR/link-sources.txt"
          if grep -q /usr/local/ "$BBT_WORK_DIR/link-sources.txt"; then
            echo "FATAL: 链接到 /usr/local" >&2
            exit 7
          fi

      - name: "Cleanup test workspace"
        if: always()
        run: rm -rf "$BBT_WORK_DIR" "$BOOST_PREFIX" "$BBT_DEPS_DIR"

  # 结果汇聚：**always** 运行，把四个真实 job 结果交给已发布 callee 的 result 契约。
  # 必跑（required）失败/cancelled/空/意外 skipped → verdict=failure → 调用非零失败。
  result:
    name: "结果汇聚（framework result callee）"
    needs: [changes, plan, build, test]
    if: ${{ always() }}
    uses: yqm-307/bbt-framework/.github/workflows/bbtools-classify-v1.yml@1c0b0fb0ebc8e7ca3888aa4f6a74d1baecf08cc7
    permissions:
      contents: read
    with:
      repo: ${{ github.repository }}
      source_sha: ${{ github.sha }}
      profile: hosted
      concurrency: "2"
      timeout_minutes: "60"
      # 复用与 plan 相同的受限输入；changes 失败时其 outputs 为空，显式回退为保守值
      # （空变更 + unknown → callee 判 unknown→执行全部），使 result 仍能汇聚真实 job 结果。
      event_json: ${{ needs.changes.outputs.event_json || format('{{"name":"{0}"}}', github.event_name) }}
      changed_files_json: ${{ needs.changes.outputs.changed_files_json || '[]' }}
      required_checks_json: '["changes","plan"]'
      optional_checks_json: '["build","test"]'
      classifier_status: ${{ needs.changes.outputs.classifier_status || 'unknown' }}
      # 汇聚四个真实 job 的 needs.*.result（含 skipped），不构造假状态、不省略键。
      results_json: ${{ format('{{"changes":"{0}","plan":"{1}","build":"{2}","test":"{3}"}}', needs.changes.result, needs.plan.result, needs.build.result, needs.test.result) }}

  # 手动工具链身份验收（原现役 ci.yml 任务原样保留，非 required）：证明「实际 runner 用的
  # 工具链」满足 docker/toolchain.lock，而不只是 Dockerfile 可构建。仅在 workflow_dispatch
  # 运行；不属 required checks，未部署固定镜像前在旧 runner 上预期失败（fail-closed，不绿色 skipped）。
  toolchain-verify:
    name: "Toolchain identity (candidate, manual)"
    if: github.event_name == 'workflow_dispatch'
    runs-on: arc-s4-framework
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: 校验实际 runner 工具链身份（fail-closed，显式绑定本仓 lock）
        # 复检 checkout 与本 job 的 runner image 是否同一工具链身份；F4 要求显式
        # 传入本仓 docker/toolchain.lock，避免镜像内置旧 lock 冒充当前仓契约。
        run: bash scripts/verify_toolchain.sh --in-image --lock "$GITHUB_WORKSPACE/docker/toolchain.lock"

  # 双服务资源验收（原现役 ci.yml 任务原样保留）：手动触发、非 required，不依赖共享 runner
  # 已切镜像。资源仍由 infra 唯一 recipe 生成；本 job 只消费固定 SHA 的 recipe，禁止复制
  # hiredis/mongo 构建逻辑。inputs/资源边界（recipe SHA、Redis/Mongo 镜像 digest、专用前缀与
  # 清理）不变。
  resource-acceptance:
    name: "Dual-service resource acceptance (manual)"
    if: github.event_name == 'workflow_dispatch' && inputs.resource_acceptance == true
    runs-on: arc-s4-framework
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      BBT_JOBS: "3"
      BBT_DEPS_DIR: ${{ github.workspace }}/.deps
      BBT_RESOURCE_ROOT: ${{ github.workspace }}/.resource-deps
      # infra recipe 的不可变候选 SHA；更新时必须重跑 recipe + 验收。
      RESOURCE_RECIPE_SHA: "1543bbd0aca4defa1be701b45aea5ba2cc2d0d86"
      BBT_DEMO_REDIS_IMAGE: "redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499"
      BBT_DEMO_MONGO_IMAGE: "mongo@sha256:4968f22d0c6c10ef29952f3e807f62872ba22b3312f25803564fbfc08255efc2"
    steps:
      - name: Checkout framework
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Print acceptance inputs
        run: |
          set -euo pipefail
          echo "framework_sha=$(git rev-parse HEAD)"
          echo "resource_recipe_sha=$RESOURCE_RECIPE_SHA"
          echo "redis_image=$BBT_DEMO_REDIS_IMAGE"
          echo "mongo_image=$BBT_DEMO_MONGO_IMAGE"
          command -v docker
          docker version --format '{{.Server.Version}}'

      - name: Fetch framework pinned source dependencies
        run: bash scripts/fetch_deps.sh

      - name: Checkout pinned resource recipe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: yqm-307/bbtools-infra
          ref: ${{ env.RESOURCE_RECIPE_SHA }}
          path: .resource-recipe
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare locked protobuf prefix
        run: bash scripts/prepare_protobuf.sh "$GITHUB_WORKSPACE/.deps/protobuf-3.21.12"

      - name: Prepare pinned resource dependency prefix
        run: |
          set -euo pipefail
          test "$(git -C .resource-recipe rev-parse HEAD)" = "$RESOURCE_RECIPE_SHA"
          bash .resource-recipe/scripts/prepare_resource_deps.sh "$BBT_RESOURCE_ROOT" --jobs "$BBT_JOBS"
          test -f "$BBT_RESOURCE_ROOT/resource-deps.manifest.json"
          python3 -m json.tool "$BBT_RESOURCE_ROOT/resource-deps.manifest.json" >/dev/null
          echo "BBT_DEMO_EXPECT_CACHE_KEY=$(bash .resource-recipe/scripts/prepare_resource_deps.sh --print-cache-key)" >> "$GITHUB_ENV"

      - name: Build dual-service example with explicit resources
        run: |
          set -euo pipefail
          export BBT_CMAKE_ARGS="-DBBT_PROTOBUF_PREFIX=$GITHUB_WORKSPACE/.deps/protobuf-3.21.12 -DBBT_HIREDIS_PREFIX=$BBT_RESOURCE_ROOT/hiredis -DBBT_MONGOC_PREFIX=$BBT_RESOURCE_ROOT/mongoc -DBBT_MONGOCXX_PREFIX=$BBT_RESOURCE_ROOT/mongocxx -DBBT_ENABLE_DUAL_SERVICE_EXAMPLE=ON"
          export BBT_WORK_DIR="$GITHUB_WORKSPACE/.dual-resource-work"
          export BBT_BUILD_DIR="$BBT_WORK_DIR/project-build"
          bash scripts/build_stack.sh
          cmake --build "$BBT_BUILD_DIR" --parallel "$BBT_JOBS" --target svc_a svc_b driver

      - name: Run real Redis/Mongo multi-process acceptance
        run: |
          set -euo pipefail
          bash examples/dual_service/run_acceptance.sh "$GITHUB_WORKSPACE/.dual-resource-work/project-build"

      - name: Cleanup acceptance workspace
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/.dual-resource-work" "$GITHUB_WORKSPACE/.resource-deps" "$GITHUB_WORKSPACE/.resource-recipe" "$GITHUB_WORKSPACE/.deps"
