name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_DIR: ${{ github.workspace }}/build
  INFRA_DIR: ${{ github.workspace }}/infra
  COROUTINE_DIR: ${{ github.workspace }}/coroutine

jobs:
  build-and-test:
    name: 编译 & ctest
    runs-on: arc-s4-framework
    steps:
      - name: 拉取 bbt-framework
        uses: actions/checkout@v4
        with:
          path: framework

      - name: 拉取 bbtools-infra @ main
        uses: actions/checkout@v4
        with:
          repository: yqm-307/bbtools-infra
          ref: main
          path: infra

      - name: 拉取 bbtools-coroutine @ main
        uses: actions/checkout@v4
        with:
          repository: yqm-307/bbtools-coroutine
          ref: main
          path: coroutine

      - name: 打印依赖来源
        run: |
          echo "=== infra HEAD ==="
          git -C "$INFRA_DIR" log -1 --format='%H %s (%ci)'
          echo "=== coroutine HEAD ==="
          git -C "$COROUTINE_DIR" log -1 --format='%H %s (%ci)'
          echo "=== framework HEAD ==="
          git -C framework log -1 --format='%H %s (%ci)'

      - name: cmake configure
        run: |
          cmake -S framework -B "$BUILD_DIR" -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNEED_TEST=ON \
            -DBBT_INFRA_SOURCE_DIR="$INFRA_DIR" \
            -DBBT_COROUTINE_SOURCE_DIR="$COROUTINE_DIR"

      - name: ninja build
        run: ninja -C "$BUILD_DIR" -j"$(nproc)"

      - name: ctest -j1
        run: ctest -j1 --output-on-failure --timeout 300
        working-directory: ${{ env.BUILD_DIR }}

      - name: 依赖来源核查
        run: |
          echo "=== _deps 下产物 ==="
          find "$BUILD_DIR/_deps" -name '*.so' -o -name '*.a' 2>/dev/null | sort || true
          echo "=== test 二进制 ldd（关键依赖） ==="
          for t in "$BUILD_DIR"/tests/Test_*; do
            [ -x "$t" ] || continue
            echo "--- $t ---"
            ldd "$t" 2>/dev/null | grep -E 'bbt|boost' || echo "(静态/无外部依赖)"
          done
