# bbt-framework 正式普通 CI（唯一权威普通入口）。骨架（方案 §2.7）：
# changes → docs-check → build-test（Release 构建 + smoke profile 测试 +
# 必要 focused，ubuntu-24.04）→ result。
# 分类与结果判定本仓内联（scripts/ci/changed_files.py + scripts/ci/result.py），
# classify/result callee 链已删除；单 runner 内联执行，不再跨 runner 传归档。
# 判据保留：deps.lock 固定 SHA、锁定 protobuf/Boost 私有前缀、dual-service 负向门禁、
# 链接来源证据、run_test_profile.sh --profile smoke（-L smoke + 注册集=实跑集 +
# skipped/Not Run/failure/error 一律失败）+ 必要 focused（changes 的
# focused_regex 非空时同一构建树追加 --profile focused）、ldd 来源核查、
# provenance（manifest+envelope，真实字节 sha256）由 gate build 内联产出。
# required check 唯一落点 result job；手动任务（toolchain-verify/resource-acceptance）
# 非 required 原样保留；clang-format 改动行检查在 changes 内 continue-on-error（先非必需）。
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # 手动重跑普通 build→test；toolchain-verify/resource-acceptance 在 manual.yml。
  workflow_dispatch:

permissions: {}

concurrency:
  # main/手动：group 含 run_id → 逐提交独立；PR：只取消同一 PR 的旧 run。
  group: ci-${{ github.event_name == 'pull_request' && github.ref || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BBT_WORK_DIR: ${{ github.workspace }}/.ci-work
  BBT_BUILD_DIR: ${{ github.workspace }}/.ci-work/project-build
  BBT_DEPS_DIR: ${{ github.workspace }}/.deps
  BBT_PROTOBUF_PREFIX: ${{ github.workspace }}/.deps/protobuf-3.21.12
  BOOST_PREFIX: ${{ github.workspace }}/boost-prefix
  BBT_BUILD_ARCHIVE: ${{ github.workspace }}/build-tree.tar.gz
  # hosted 4 vCPU：固定 3，与三仓统一并发口径一致，不按 nproc 抢占。
  BBT_JOBS: "3"

jobs:
  # 变更集 + 本仓内联分类；无法确定保守回退 unknown（执行全部）。job 名保持现役名。
  changes:
    name: "变更类型检测"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changed_files_json: ${{ steps.diff.outputs.changed_files_json }}
      classifier_status: ${{ steps.diff.outputs.classifier_status }}
      classification: ${{ steps.diff.outputs.classification }}
      event_json: ${{ steps.diff.outputs.event_json }}
      focused_regex: ${{ steps.diff.outputs.focused_regex }}
    steps:
      - name: "拉取代码库（含历史，供三点 diff）"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "从真实 diff 计算受限变更集 + 本仓内联分类（未知保守全部）"
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/ci/changed_files.py

      # clang-format 改动行检查：先非必需（continue-on-error，只告警不阻断，D5 第一步）。
      - name: "clang-format 改动行检查（非必需，告警不阻断）"
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          set -euo pipefail
          if ! command -v git-clang-format >/dev/null 2>&1 \
             && ! command -v clang-format-diff.py >/dev/null 2>&1 \
             && ! command -v clang-format-diff >/dev/null 2>&1; then
            echo "::warning::git-clang-format/clang-format-diff 不在 PATH，跳过改动行格式检查"
            exit 0
          fi
          bash scripts/ci/check_format_diff.sh "origin/${{ github.base_ref }}"

  # docs-check：相对链接有效 + docs 文件名无过程编号 + README 行数上限。
  # 恒跑（required）：docs-only PR 只跑本 job 与 changes。
  docs_check:
    name: "Docs check"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: "拉取代码库"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: "docs-check（链接/文件名/README 上限）"
        run: python3 -I scripts/ci/check_docs.py --root . --readme-max 200

  # 重型构建+测试（单 hosted runner）：code/unknown 才跑，docs-only 显式跳过。
  build_test:
    # display name 保持远端 required check 现役值；profile 内部仍以 ctest -j1
    # 统一入口执行（smoke + 必要 focused），名称不含 profile 描述不失真。
    name: "Build + Test (pinned deps, ctest -j1)"
    needs: [changes]
    if: ${{ needs.changes.result == 'success' && needs.changes.outputs.classification != 'docs-only' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      # 跨 run 只复用两类东西：ccache 编译对象、已按锁定 sha256 校验的 Boost 源码
      # 归档。都放 runner.temp（不进工作区），路径里没有 build 树/任何 prefix。
      # 可见范围由 GitHub ref scope 决定（PR 写 merge-ref、main 读默认分支），
      # key 与下面的 if 只决定「取哪份/存不存」，不构成安全边界。
      # job 级 env 不允许 runner context：两个目录由下面的初始化步骤写进
      # $GITHUB_ENV，缓存步骤的 path 用步骤级 runner.temp。
      CCACHE_EPOCH: v1
      CCACHE_MAX_SIZE: 500M
      # fork PR 保持「不装 ccache、不写对象缓存」：对象是可执行内容，只让同仓
      # 与默认分支建立条目。此开关不扩大任何权限，也不改变 pull_request 触发面。
      CACHE_ALLOWED: "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}"
    steps:
      - name: "拉取代码库"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      # 缓存目录取自 runner.temp；同时显式设置 ccache 开关：镜像若偶然预装 ccache，
      # 禁用态必须关掉，避免镜像里的工具被当成 launcher 隐式启用对象缓存。
      - name: "初始化缓存目录与 ccache 开关"
        run: |
          set -euo pipefail
          {
            echo "CCACHE_DIR=$RUNNER_TEMP/ccache"
            echo "BOOST_SOURCE_CACHE=$RUNNER_TEMP/src-cache"
          } >> "$GITHUB_ENV"
          if [ "$CACHE_ALLOWED" = 'true' ]; then
            echo "CCACHE_NODISABLE=true" >> "$GITHUB_ENV"
          else
            echo "CCACHE_DISABLE=1" >> "$GITHUB_ENV"
          fi

      - name: "安装 ccache（hosted 临时 runner；真实版本进缓存键）"
        if: env.CACHE_ALLOWED == 'true'
        run: |
          set -euo pipefail
          # 镜像不自带 ccache，必须显式安装。不钉 apt 包版本：从受认证源装可用版本，
          # 解析实际版本（进缓存键），只做主版本 >=4 的语义检查。
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ccache
          version="$(ccache --version | sed -n '1s/^ccache version \([0-9][0-9.]*\).*$/\1/p')"
          case "$version" in
            4.*|[5-9].*) ;;
            *) echo "FATAL: ccache 版本 '$version' 不满足 >=4（--set-config/base_dir 语义）" >&2; exit 2 ;;
          esac
          # 依赖/工具链指纹：任一固定输入变化即更换恢复前缀，恢复不跨指纹。
          # 只列本仓真实存在的固定输入（本仓无单独 cmake/ 目录）。
          deps_files=(
            CMakeLists.txt
            deps.lock
            scripts/prepare_protobuf.sh
            scripts/ci/prepare_boost.sh
          )
          deps_id="$(sha256sum "${deps_files[@]}" | sha256sum | cut -c1-16)"
          {
            echo "CCACHE_VERSION=$version"
            echo "GCC_ID=$(g++ -dumpversion)"
            echo "DEPS_ID=$deps_id"
          } >> "$GITHUB_ENV"

      - name: "恢复 ccache 编译对象（缓存服务异常不阻断冷构建）"
        if: env.CACHE_ALLOWED == 'true'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ env.CCACHE_EPOCH }}-linux-gcc${{ env.GCC_ID }}-cc${{ env.CCACHE_VERSION }}-deps${{ env.DEPS_ID }}-run${{ github.run_id }}-a${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ env.CCACHE_EPOCH }}-linux-gcc${{ env.GCC_ID }}-cc${{ env.CCACHE_VERSION }}-deps${{ env.DEPS_ID }}

      - name: "恢复已校验 Boost 源码归档（只存 tar.gz，不存 prefix/解包树）"
        if: env.CACHE_ALLOWED == 'true'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/src-cache
          key: boost-src-1.90.0-5e93d582aff2

      - name: "固化 ccache 配置并清零统计（恢复后重设，避免被缓存内旧配置覆盖）"
        if: env.CACHE_ALLOWED == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=max_size="$CCACHE_MAX_SIZE"
          ccache --set-config=compression=true
          ccache --set-config=compiler_check=content
          ccache --set-config=base_dir="$GITHUB_WORKSPACE"
          # 归零计数：日志里的命中数只反映本次 run（恢复的旧计数不得混入判读）。
          ccache --zero-stats
          # 编译器 launcher 走既有 BBT_CMAKE_ARGS 透传口（run_framework_gate.sh），
          # 不改 gate/build 脚本；fork PR 不装 ccache 时不设该变量。
          echo "BBT_CMAKE_ARGS=-DCMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          ccache --show-config | sed -n '1,20p'

      - name: "拉取 deps.lock 固定依赖（coroutine/infra 源码树）"
        run: bash scripts/fetch_deps.sh

      - name: "准备锁定 protobuf 前缀（私有前缀）"
        run: bash scripts/prepare_protobuf.sh "$BBT_PROTOBUF_PREFIX"

      - name: "复现锁定 Boost 1.90 context（工作区私有前缀，hosted 无 /opt/boost）"
        run: bash scripts/ci/prepare_boost.sh "$BOOST_PREFIX" --jobs "$BBT_JOBS"

      - name: "写入 Boost 源码归档缓存（仅 push 建立本仓共享条目，PR 只读）"
        if: success() && github.event_name == 'push' && env.CACHE_ALLOWED == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/src-cache
          key: boost-src-1.90.0-5e93d582aff2

      # CI 契约/缓存回归：静态断言与 prepare_boost 缓存行为用例必须在 hosted 门禁里
      # 跑，否则 workflow 漂移可以绕过它们（不新增 action、不装依赖）。
      - name: "CI 契约与缓存回归测试（scripts/ci/test_formal_ci.py）"
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci/test_formal_ci.py

      - name: "构建 + 门禁 + 封包 + provenance（等价现役 build 判据）"
        run: |
          set -euo pipefail
          bash scripts/ci/run_framework_gate.sh build \
            --repo-dir "$GITHUB_WORKSPACE" \
            --work-dir "$BBT_WORK_DIR" \
            --deps-dir "$BBT_DEPS_DIR" \
            --protobuf-prefix "$BBT_PROTOBUF_PREFIX" \
            --boost-prefix "$BOOST_PREFIX" \
            --archive "$BBT_BUILD_ARCHIVE" \
            --pack-root "$GITHUB_WORKSPACE" \
            --jobs "$BBT_JOBS" \
            --job-id build \
            --source-repo "$GITHUB_REPOSITORY" \
            --source-sha "$GITHUB_SHA" \
            --automation-repo "$GITHUB_REPOSITORY" \
            --automation-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: "导出锁定 Boost runtime 前缀（hosted 无 /opt/boost，私有前缀）"
        run: |
          test -e "$BOOST_PREFIX/lib/libboost_context.so"
          echo "BOOST_ROOT=$BOOST_PREFIX" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$BOOST_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: "Verify test binaries resolve libs (fail-fast)"
        run: |
          # 镜像 LD_LIBRARY_PATH 会把 NEEDED 抢绑到 /usr/local 旧产物；与 build 侧同款剔除。
          if [ -n "${LD_LIBRARY_PATH:-}" ]; then
            LD_LIBRARY_PATH="$(printf '%s' "$LD_LIBRARY_PATH" | tr ':' '\n' | grep -vE '^/usr/local(/|$)' | paste -sd: -)"
            export LD_LIBRARY_PATH
          fi
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-<empty>}"
          missing=0
          found=0
          for bin in "$BBT_BUILD_DIR"/tests/Test_framework_*; do
            [ -x "$bin" ] || continue
            found=$((found + 1))
            echo "--- $bin ---"
            ldd "$bin" 2>/dev/null | grep -E 'bbt|boost' || echo "(静态/无外部依赖)"
            if ldd "$bin" 2>/dev/null | grep -q 'not found'; then
              echo "FATAL: $bin 有未解析依赖" >&2
              missing=1
            fi
          done
          # 零命中必须明确失败：禁止 [ -x ] 全跳过后带着空证据混过去。
          if [ "$found" -eq 0 ]; then
            echo "FATAL: 未找到可执行测试二进制 ($BBT_BUILD_DIR/tests/Test_framework_*)" >&2
            ls -la "$BBT_BUILD_DIR"/tests/ >&2 || true
            exit 9
          fi
          if ldd "$BBT_BUILD_DIR/tests/rpc_xlang_server" | grep -q 'not found'; then
            echo "FATAL: rpc_xlang_server 有未解析依赖" >&2
            missing=1
          fi
          echo "verified binaries: $found"
          # 检查 Boost context runtime 解析路径在私有前缀（不许系统预装假替代）。
          boost_links=$(ldd "$BBT_BUILD_DIR"/tests/Test_framework_* 2>/dev/null)
          if ! printf '%s\n' "$boost_links" | grep -E 'libboost_context[^ ]* => ' | grep -Fq "=> $BOOST_PREFIX/lib/"; then
            echo "FATAL: libboost_context 未解析到锁定 Boost 前缀" >&2
            missing=1
          fi
          # bbt 必须解析到 build 树内（干净 runner 不许吃 /usr/local 旧产物）
          if ldd "$BBT_BUILD_DIR"/tests/Test_framework_* 2>/dev/null | grep -q '/usr/local/.*bbt'; then
            echo "FATAL: 链接到 /usr/local 下的 bbt 旧产物" >&2
            missing=1
          fi
          exit "$missing"

      - name: "Link-source evidence 复核"
        run: |
          test -f "$BBT_WORK_DIR/deps-manifest.txt"
          test -f "$BBT_WORK_DIR/link-sources.txt"
          cat "$BBT_WORK_DIR/deps-manifest.txt"
          cat "$BBT_WORK_DIR/link-sources.txt"
          if grep -q /usr/local/ "$BBT_WORK_DIR/link-sources.txt"; then
            echo "FATAL: 链接到 /usr/local" >&2
            exit 7
          fi

      - name: "CTest smoke profile (run_test_profile.sh)"
        run: |
          # ctest 子进程继承本 step 环境，先剔除 /usr/local（RUNPATH 救不回来）。
          if [ -n "${LD_LIBRARY_PATH:-}" ]; then
            LD_LIBRARY_PATH="$(printf '%s' "$LD_LIBRARY_PATH" | tr ':' '\n' | grep -vE '^/usr/local(/|$)' | paste -sd: -)"
            export LD_LIBRARY_PATH
          fi
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-<empty>}"
          # 统一 profile 入口：-L smoke 选集 → 注册集=实跑集校验 →
          # skipped/Not Run/failure/error 一律失败（脚本内 fail-closed，
          # 空选集同样非零退出）。
          bash scripts/ci/run_test_profile.sh \
            --build-dir "$BBT_BUILD_DIR" \
            --profile smoke \
            --timeout 300

      - name: "CTest focused profile (run_test_profile.sh, 必要追加)"
        # 同一构建树内追加必要 focused：changes 按「路径前缀→ctest 名」映射
        # 产出 focused_regex；空串（无映射命中，如纯 docs/CI 配置改动）不执行本步。
        if: ${{ needs.changes.outputs.focused_regex != '' }}
        run: |
          # 与 smoke 步同口径剔除 /usr/local（本 step 独立环境）。
          if [ -n "${LD_LIBRARY_PATH:-}" ]; then
            LD_LIBRARY_PATH="$(printf '%s' "$LD_LIBRARY_PATH" | tr ':' '\n' | grep -vE '^/usr/local(/|$)' | paste -sd: -)"
            export LD_LIBRARY_PATH
          fi
          bash scripts/ci/run_test_profile.sh \
            --build-dir "$BBT_BUILD_DIR" \
            --profile focused \
            --regex '${{ needs.changes.outputs.focused_regex }}' \
            --timeout 300

      - name: "ccache 统计（命中率入日志，供冷暖对照判读）"
        if: always() && env.CACHE_ALLOWED == 'true'
        run: |
          set -euo pipefail
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats -v || true
          else
            echo "ccache 未安装（fork PR 或前置步骤失败），跳过统计"
          fi

      - name: "保存 ccache 编译对象（仅成功；上限 500M，键含 run/attempt）"
        if: success() && env.CACHE_ALLOWED == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ env.CCACHE_EPOCH }}-linux-gcc${{ env.GCC_ID }}-cc${{ env.CCACHE_VERSION }}-deps${{ env.DEPS_ID }}-run${{ github.run_id }}-a${{ github.run_attempt }}

      - name: "Cleanup workspace"
        if: always()
        run: rm -rf "$BBT_WORK_DIR" "$BOOST_PREFIX" "$BBT_DEPS_DIR" "$BBT_BUILD_ARCHIVE"

  # 结果汇聚（唯一 required check，context=ci/result）：always 运行，
  # needs.*.result → scripts/ci/result.py，fail-closed。
  result:
    needs: [changes, docs_check, build_test]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      RESULTS_JSON: ${{ format('{{"changes":"{0}","docs_check":"{1}","build_test":"{2}"}}', needs.changes.result, needs.docs_check.result, needs.build_test.result) }}
      # changes 失败时 outputs 为空，回退 unknown → 按「执行全部」判。
      CLASSIFICATION: ${{ needs.changes.outputs.classification || 'unknown' }}
    steps:
      - name: "拉取代码库（result.py 在仓内）"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: "汇聚 needs.*.result → verdict（fail-closed，非零即红）"
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/result-input.json"
          python3 - "$payload" <<'PY'
          import json
          import os
          import sys

          payload = {
              "results": json.loads(os.environ["RESULTS_JSON"]),
              "required": ["changes", "docs_check"],
              "optional": ["build_test"],
              "classification": os.environ["CLASSIFICATION"],
          }
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump(payload, handle)
          PY
          cat "$payload"
          echo
          python3 scripts/ci/result.py --file "$payload"
