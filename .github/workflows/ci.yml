# bbt-framework 正式普通 CI（唯一权威普通入口）。骨架（方案 §2.7）：
# changes → docs-check → build-test（Release 构建 + ctest，ubuntu-24.04）→ result。
# 分类与结果判定本仓内联（scripts/ci/changed_files.py + scripts/ci/result.py），
# classify/result callee 链已删除；单 runner 内联执行，不再跨 runner 传归档。
# 判据保留：deps.lock 固定 SHA、锁定 protobuf/Boost 私有前缀、dual-service 负向门禁、
# 链接来源证据、ctest -j1 --timeout 300 --output-on-failure --no-tests=error + SKIP 门禁、
# ldd 来源核查、provenance（manifest+envelope，真实字节 sha256）由 gate build 内联产出。
# required check 唯一落点 result job；手动任务（toolchain-verify/resource-acceptance）
# 非 required 原样保留；clang-format 改动行检查在 changes 内 continue-on-error（先非必需）。
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # 手动重跑普通 build→test；toolchain-verify/resource-acceptance 在 manual.yml。
  workflow_dispatch:

permissions: {}

concurrency:
  # main/手动：group 含 run_id → 逐提交独立；PR：只取消同一 PR 的旧 run。
  group: ci-${{ github.event_name == 'pull_request' && github.ref || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BBT_WORK_DIR: ${{ github.workspace }}/.ci-work
  BBT_BUILD_DIR: ${{ github.workspace }}/.ci-work/project-build
  BBT_DEPS_DIR: ${{ github.workspace }}/.deps
  BBT_PROTOBUF_PREFIX: ${{ github.workspace }}/.deps/protobuf-3.21.12
  BOOST_PREFIX: ${{ github.workspace }}/boost-prefix
  BBT_BUILD_ARCHIVE: ${{ github.workspace }}/build-tree.tar.gz
  # hosted 4 vCPU：固定 3，与三仓统一并发口径一致，不按 nproc 抢占。
  BBT_JOBS: "3"

jobs:
  # 变更集 + 本仓内联分类；无法确定保守回退 unknown（执行全部）。job 名保持现役名。
  changes:
    name: "变更类型检测"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changed_files_json: ${{ steps.diff.outputs.changed_files_json }}
      classifier_status: ${{ steps.diff.outputs.classifier_status }}
      classification: ${{ steps.diff.outputs.classification }}
      event_json: ${{ steps.diff.outputs.event_json }}
    steps:
      - name: "拉取代码库（含历史，供三点 diff）"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "从真实 diff 计算受限变更集 + 本仓内联分类（未知保守全部）"
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/ci/changed_files.py

      # clang-format 改动行检查：先非必需（continue-on-error，只告警不阻断，D5 第一步）。
      - name: "clang-format 改动行检查（非必需，告警不阻断）"
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          set -euo pipefail
          if ! command -v git-clang-format >/dev/null 2>&1 \
             && ! command -v clang-format-diff.py >/dev/null 2>&1 \
             && ! command -v clang-format-diff >/dev/null 2>&1; then
            echo "::warning::git-clang-format/clang-format-diff 不在 PATH，跳过改动行格式检查"
            exit 0
          fi
          bash scripts/ci/check_format_diff.sh "origin/${{ github.base_ref }}"

  # docs-check：相对链接有效 + docs 文件名无过程编号 + README 行数上限。
  # 恒跑（required）：docs-only PR 只跑本 job 与 changes。
  docs_check:
    name: "Docs check"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: "拉取代码库"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: "docs-check（链接/文件名/README 上限）"
        run: python3 -I scripts/ci/check_docs.py --root . --readme-max 200

  # 重型构建+测试（单 hosted runner）：code/unknown 才跑，docs-only 显式跳过。
  build_test:
    name: "Build + Test (pinned deps, ctest -j1)"
    needs: [changes]
    if: ${{ needs.changes.result == 'success' && needs.changes.outputs.classification != 'docs-only' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: "拉取代码库"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: "拉取 deps.lock 固定依赖（coroutine/infra 源码树）"
        run: bash scripts/fetch_deps.sh

      - name: "准备锁定 protobuf 前缀（私有前缀）"
        run: bash scripts/prepare_protobuf.sh "$BBT_PROTOBUF_PREFIX"

      - name: "复现锁定 Boost 1.90 context（工作区私有前缀，hosted 无 /opt/boost）"
        run: bash scripts/ci/prepare_boost.sh "$BOOST_PREFIX" --jobs "$BBT_JOBS"

      - name: "构建 + 门禁 + 封包 + provenance（等价现役 build 判据）"
        run: |
          set -euo pipefail
          bash scripts/ci/run_framework_gate.sh build \
            --repo-dir "$GITHUB_WORKSPACE" \
            --work-dir "$BBT_WORK_DIR" \
            --deps-dir "$BBT_DEPS_DIR" \
            --protobuf-prefix "$BBT_PROTOBUF_PREFIX" \
            --boost-prefix "$BOOST_PREFIX" \
            --archive "$BBT_BUILD_ARCHIVE" \
            --pack-root "$GITHUB_WORKSPACE" \
            --jobs "$BBT_JOBS" \
            --job-id build \
            --source-repo "$GITHUB_REPOSITORY" \
            --source-sha "$GITHUB_SHA" \
            --automation-repo "$GITHUB_REPOSITORY" \
            --automation-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: "导出锁定 Boost runtime 前缀（hosted 无 /opt/boost，私有前缀）"
        run: |
          test -e "$BOOST_PREFIX/lib/libboost_context.so"
          echo "BOOST_ROOT=$BOOST_PREFIX" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$BOOST_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: "Verify test binaries resolve libs (fail-fast)"
        run: |
          # 镜像 LD_LIBRARY_PATH 会把 NEEDED 抢绑到 /usr/local 旧产物；与 build 侧同款剔除。
          if [ -n "${LD_LIBRARY_PATH:-}" ]; then
            LD_LIBRARY_PATH="$(printf '%s' "$LD_LIBRARY_PATH" | tr ':' '\n' | grep -vE '^/usr/local(/|$)' | paste -sd: -)"
            export LD_LIBRARY_PATH
          fi
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-<empty>}"
          missing=0
          found=0
          for bin in "$BBT_BUILD_DIR"/tests/Test_framework_*; do
            [ -x "$bin" ] || continue
            found=$((found + 1))
            echo "--- $bin ---"
            ldd "$bin" 2>/dev/null | grep -E 'bbt|boost' || echo "(静态/无外部依赖)"
            if ldd "$bin" 2>/dev/null | grep -q 'not found'; then
              echo "FATAL: $bin 有未解析依赖" >&2
              missing=1
            fi
          done
          # 零命中必须明确失败：禁止 [ -x ] 全跳过后带着空证据混过去。
          if [ "$found" -eq 0 ]; then
            echo "FATAL: 未找到可执行测试二进制 ($BBT_BUILD_DIR/tests/Test_framework_*)" >&2
            ls -la "$BBT_BUILD_DIR"/tests/ >&2 || true
            exit 9
          fi
          if ldd "$BBT_BUILD_DIR/tests/rpc_xlang_server" | grep -q 'not found'; then
            echo "FATAL: rpc_xlang_server 有未解析依赖" >&2
            missing=1
          fi
          echo "verified binaries: $found"
          # 检查 Boost context runtime 解析路径在私有前缀（不许系统预装假替代）。
          boost_links=$(ldd "$BBT_BUILD_DIR"/tests/Test_framework_* 2>/dev/null)
          if ! printf '%s\n' "$boost_links" | grep -E 'libboost_context[^ ]* => ' | grep -Fq "=> $BOOST_PREFIX/lib/"; then
            echo "FATAL: libboost_context 未解析到锁定 Boost 前缀" >&2
            missing=1
          fi
          # bbt 必须解析到 build 树内（干净 runner 不许吃 /usr/local 旧产物）
          if ldd "$BBT_BUILD_DIR"/tests/Test_framework_* 2>/dev/null | grep -q '/usr/local/.*bbt'; then
            echo "FATAL: 链接到 /usr/local 下的 bbt 旧产物" >&2
            missing=1
          fi
          exit "$missing"

      - name: "Link-source evidence 复核"
        run: |
          test -f "$BBT_WORK_DIR/deps-manifest.txt"
          test -f "$BBT_WORK_DIR/link-sources.txt"
          cat "$BBT_WORK_DIR/deps-manifest.txt"
          cat "$BBT_WORK_DIR/link-sources.txt"
          if grep -q /usr/local/ "$BBT_WORK_DIR/link-sources.txt"; then
            echo "FATAL: 链接到 /usr/local" >&2
            exit 7
          fi

      - name: "CTest (镜像 scripts/run_ctest.sh 门禁 + --timeout 300)"
        run: |
          # ctest 子进程继承本 step 环境，先剔除 /usr/local（RUNPATH 救不回来）。
          if [ -n "${LD_LIBRARY_PATH:-}" ]; then
            LD_LIBRARY_PATH="$(printf '%s' "$LD_LIBRARY_PATH" | tr ':' '\n' | grep -vE '^/usr/local(/|$)' | paste -sd: -)"
            export LD_LIBRARY_PATH
          fi
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-<empty>}"
          set +e
          ctest --test-dir "$BBT_BUILD_DIR" -j1 --timeout 300 --output-on-failure --no-tests=error | tee "$BBT_BUILD_DIR/ctest.log"
          rc=${PIPESTATUS[0]}
          set -e
          # 只认 ctest 自身的结果行，同时要求 100% 全绿。
          if grep -Eq '^[ ]*[0-9]+/[0-9]+ Test #[0-9]+:.*\*\*\*(Skipped|Not Run)' "$BBT_BUILD_DIR/ctest.log"; then
            echo "FATAL: 检测到 SKIP/Not Run，禁止报全绿" >&2
            exit 8
          fi
          if ! grep -Eq '100% tests passed, 0 tests failed' "$BBT_BUILD_DIR/ctest.log"; then
            echo "FATAL: 未达成 100% 全绿" >&2
            exit 8
          fi
          exit "$rc"

      - name: "Cleanup workspace"
        if: always()
        run: rm -rf "$BBT_WORK_DIR" "$BOOST_PREFIX" "$BBT_DEPS_DIR" "$BBT_BUILD_ARCHIVE"

  # 结果汇聚（唯一 required check，context=ci/result）：always 运行，
  # needs.*.result → scripts/ci/result.py，fail-closed。
  result:
    needs: [changes, docs_check, build_test]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      RESULTS_JSON: ${{ format('{{"changes":"{0}","docs_check":"{1}","build_test":"{2}"}}', needs.changes.result, needs.docs_check.result, needs.build_test.result) }}
      # changes 失败时 outputs 为空，回退 unknown → 按「执行全部」判。
      CLASSIFICATION: ${{ needs.changes.outputs.classification || 'unknown' }}
    steps:
      - name: "拉取代码库（result.py 在仓内）"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: "汇聚 needs.*.result → verdict（fail-closed，非零即红）"
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/result-input.json"
          python3 - "$payload" <<'PY'
          import json
          import os
          import sys

          payload = {
              "results": json.loads(os.environ["RESULTS_JSON"]),
              "required": ["changes", "docs_check"],
              "optional": ["build_test"],
              "classification": os.environ["CLASSIFICATION"],
          }
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump(payload, handle)
          PY
          cat "$payload"
          echo
          python3 scripts/ci/result.py --file "$payload"
