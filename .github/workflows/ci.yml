# Issue #6：最小构建 + CTest 冒烟。不在本 workflow 跑 compose/压测。
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: [self-hosted, linux]
    timeout-minutes: 20
    env:
      BBT_JOBS: "1"
      BBT_NEED_TEST: "ON"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch pinned deps
        env:
          BBT_DEPS_DIR: ${{ github.workspace }}/.deps
        run: bash scripts/fetch_deps.sh

      - name: Build and CTest
        env:
          BBT_DEPS_DIR: ${{ github.workspace }}/.deps
          BBT_WORK_DIR: ${{ runner.temp }}/bbt-work
        run: bash scripts/local_build.sh

      - name: Link-source evidence
        env:
          BBT_WORK_DIR: ${{ runner.temp }}/bbt-work
        run: |
          test -f "$BBT_WORK_DIR/deps-manifest.txt"
          test -f "$BBT_WORK_DIR/link-sources.txt"
          cat "$BBT_WORK_DIR/deps-manifest.txt"
          cat "$BBT_WORK_DIR/link-sources.txt"
          if grep -q /usr/local/ "$BBT_WORK_DIR/link-sources.txt"; then
            echo "FATAL: 链接到 /usr/local" >&2
            exit 7
          fi
