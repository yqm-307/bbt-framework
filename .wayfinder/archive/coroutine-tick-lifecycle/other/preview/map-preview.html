const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const tickets=DATA.tickets||[], bySlug=Object.fromEntries(tickets.map(t=>[t.slug,t])), children=Object.fromEntries(tickets.map(t=>[t.slug,[]]));
tickets.forEach(t=>(t.blocked_by||[]).forEach(p=>{if(children[p])children[p].push(t.slug)}));
let selected=tickets[0]?.slug||null, expanded=new Set(tickets.map(t=>t.slug));
function displayStatus(t){return t.status==='closed'&&t.outcome==='resolved'?'resolved':t.archive==='incomplete'?t.status+'/archive-incomplete':t.status}
function badge(t){const s=displayStatus(t);const cls=s==='resolved'?'resolved':s==='blocked'?'blocked':'open-badge';return `<span class="badge ${cls}">${esc(s.toUpperCase())}</span>`}
function init(){
  $('#mapTitle').textContent=DATA.title||DATA.slug;$('#destination').textContent=DATA.destination||'未填写 Destination';$('#lifecycle').textContent=(DATA.lifecycle||'active').toUpperCase();$('#path').textContent=DATA.path||'';
  const metrics=[['任务',tickets.length,'c-cyan'],['已解决',tickets.filter(t=>displayStatus(t)==='resolved').length,'c-mint'],['排期波次',(DATA.waves||[]).length,'c-amber'],['异常',(DATA.anomalies||[]).length,'c-violet']];$('#stats').innerHTML=metrics.map(x=>`<div class="stat"><b class="${x[2]}">${x[1]}</b><span>${x[0]}</span></div>`).join('');
  [...new Set(tickets.map(t=>displayStatus(t)))].sort().forEach(s=>$('#status').insertAdjacentHTML('beforeend',`<option value="${esc(s)}">${esc(s)}</option>`));
  [...new Set(tickets.map(t=>t.kind))].sort().forEach(s=>$('#kind').insertAdjacentHTML('beforeend',`<option value="${esc(s)}">${esc(s)}</option>`));
  $('#query').addEventListener('input',renderTree);$('#status').addEventListener('change',renderTree);$('#kind').addEventListener('change',renderTree);$('#openOnly').addEventListener('change',renderTree);$('#expand').addEventListener('click',()=>{tickets.forEach(t=>expanded.add(t.slug));renderTree()});$('#collapse').addEventListener('click',()=>{expanded.clear();renderTree()});renderTree();renderDetail();
}
function match(t){const q=$('#query').value.trim().toLowerCase(), st=$('#status').value, k=$('#kind').value, open=$('#openOnly').checked;const text=[t.title,t.slug,t.kind,t.assignee,t.question,t.checkpoint?.next,t.checkpoint?.pending].join(' ').toLowerCase();return(!q||text.includes(q))&&(!st||displayStatus(t)===st)&&(!k||t.kind===k)&&(!open||displayStatus(t)!=='resolved')}
function roots(){return tickets.filter(t=>!(t.blocked_by||[]).some(p=>bySlug[p])).map(t=>t.slug)}
function node(slug, seen=new Set()){if(seen.has(slug))return '';seen.add(slug);const t=bySlug[slug];if(!t)return '';const descendants=(children[slug]||[]).map(c=>node(c,new Set(seen))).join('');const visible=match(t)||descendants; if(!visible)return '';const has=Boolean(children[slug]?.length), filterActive=$('#query').value.trim()||$('#status').value||$('#kind').value||$('#openOnly').checked, open=expanded.has(slug)||Boolean(filterActive);return `<div class="tree-node ${selected===slug?'selected':''} ${open?'open':''}" data-node="${esc(slug)}"><div class="tree-row" data-select="${esc(slug)}"><button class="toggle ${has?'':'placeholder'}" data-toggle="${esc(slug)}">${has?(open?'▾':'▸'):''}</button><div class="node-label"><div class="node-title">${esc(t.title)}</div><div class="node-meta">${esc(t.slug)} · ${esc(t.kind)}${t.assignee?' · '+esc(t.assignee):''}</div></div>${badge(t)}</div>${has?`<div class="children ${open?'':'hidden'}">${descendants}</div>`:''}</div>`}
function renderTree(){const html=roots().map(r=>node(r)).join('');$('#tree').innerHTML=html||'<div class="empty">没有匹配的任务</div>';document.querySelectorAll('[data-select]').forEach(e=>e.addEventListener('click',()=>{selected=e.dataset.select;renderTree();renderDetail()}));document.querySelectorAll('[data-toggle]').forEach(e=>e.addEventListener('click',ev=>{ev.stopPropagation();const s=e.dataset.toggle;expanded.has(s)?expanded.delete(s):expanded.add(s);renderTree()}))}
function renderDetail(){const t=bySlug[selected];if(!t){$('#detail').innerHTML='<div class="detail-empty">选择一个任务查看详情</div>';return}const done=(t.done_when||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>未填写</li>';const deps=(t.blocked_by||[]).map(x=>`<li>${esc(bySlug[x]?.title||x)} <span class="slug">(${esc(x)})</span></li>`).join('')||'<li>无前置依赖</li>';const cp=t.checkpoint||{};$('#detail').innerHTML=`<div class="detail-content"><div class="detail-top"><div><h2>${esc(t.title)}</h2><div class="slug">${esc(t.path)} · ${esc(t.slug)}</div></div>${badge(t)}</div><div class="section"><h3>Question</h3><p>${esc(t.question||'未填写')}</p></div><div class="section"><h3>Done when</h3><ul class="list">${done}</ul></div><div class="section"><h3>依赖</h3><ul class="list">${deps}</ul></div><div class="section"><h3>Checkpoint</h3><dl class="kv"><dt>已确认</dt><dd>${esc(cp.confirmed||'—')}</dd><dt>待决 / 阻塞</dt><dd>${esc(cp.pending||'—')}</dd><dt>下一步</dt><dd>${esc(cp.next||'—')}</dd></dl></div><div class="section"><h3>任务元数据</h3><dl class="kv"><dt>类型</dt><dd>${esc(t.kind)}</dd><dt>负责人</dt><dd>${esc(t.assignee||'—')}</dd><dt>认领会话</dt><dd>${esc(t.claim_session||'—')}</dd><dt>归档</dt><dd>${esc(t.archive||'—')}</dd></dl></div></div>`}
init();
</script></body></html>
